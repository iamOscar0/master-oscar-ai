services:
  postgres:
    image: postgres:16-alpine
    container_name: master-oscar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oscar
      POSTGRES_PASSWORD: oscar
      POSTGRES_DB: master_oscar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oscar -d master_oscar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: master-oscar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
